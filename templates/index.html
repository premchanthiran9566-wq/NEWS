<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewsLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #14161a;
      --rose: #d81b60;
      --rose-dark: #b0154d;
      --rose-tint: #fde8ef;
      --paper: #f3f4f6;
      --card: #ffffff;
      --line: #dcdfe4;
      --soft: #646b75;
      --error: #b3261e;
      --font-sans: "Libre Franklin", "Segoe UI", sans-serif;
      --font-serif: "Source Serif 4", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.55;
    }

    .app {
      display: flex;
      flex-direction: column;
      max-width: 820px;
      height: 100%;
      margin: 0 auto;
      background: var(--card);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 4px solid var(--ink);
    }

    .brand h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand h1 span { color: var(--rose); }

    .brand p {
      color: var(--soft);
      font-size: 0.85rem;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .dateline {
      color: var(--soft);
      font-size: 0.85rem;
      text-align: right;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--ink);
      border-radius: 2px;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      padding: 6px 14px;
    }

    .clear-btn:hover { background: var(--ink); color: #ffffff; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .welcome h2 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--soft);
      font-family: var(--font-serif);
      font-size: 1.1rem;
      max-width: 50ch;
    }

    .suggestions {
      margin-top: 24px;
      max-width: 520px;
      border-top: 1px solid var(--line);
    }

    .suggestions button {
      display: block;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      padding: 12px 0;
      text-align: left;
    }

    .suggestions button:hover { color: var(--rose); }

    .message {
      display: flex;
      margin-bottom: 20px;
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: 85%;
      padding: 12px 16px;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: var(--ink);
      border-radius: 2px;
      color: #ffffff;
      white-space: pre-wrap;
    }

    .assistant .bubble {
      border-left: 4px solid var(--rose);
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 1.65;
      max-width: 92%;
      padding: 2px 0 2px 16px;
    }

    .assistant .bubble.error {
      border-left-color: var(--error);
      color: var(--error);
      font-family: var(--font-sans);
      font-size: 1rem;
    }

    .bubble p + p,
    .bubble p + ul,
    .bubble p + ol,
    .bubble ul + p,
    .bubble ol + p,
    .bubble pre + p,
    .bubble p + pre { margin-top: 10px; }

    .bubble h4 {
      font-family: var(--font-sans);
      font-size: 1.05rem;
      font-weight: 800;
      margin-top: 14px;
    }

    .bubble h4:first-child { margin-top: 0; }

    .bubble ul, .bubble ol { padding-left: 22px; }

    .bubble li { margin-top: 4px; }

    .bubble li::marker { color: var(--rose); font-weight: 700; }

    .bubble code {
      background: var(--paper);
      border-radius: 3px;
      font-family: Consolas, Menlo, monospace;
      font-size: 0.85em;
      padding: 1px 5px;
    }

    .bubble pre {
      background: var(--ink);
      border-radius: 2px;
      color: #f3f4f6;
      margin-top: 10px;
      overflow-x: auto;
      padding: 12px 14px;
    }

    .bubble pre code { background: none; color: inherit; padding: 0; }

    .typing { display: flex; gap: 5px; padding: 8px 0; }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rose);
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 16px 24px 20px;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--ink);
      font: inherit;
      max-height: 160px;
      padding: 12px 14px;
      resize: none;
    }

    textarea:focus { border-color: var(--ink); outline: none; }

    .send-btn {
      background: var(--rose);
      border: none;
      border-radius: 2px;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      padding: 12px 24px;
    }

    .send-btn:hover { background: var(--rose-dark); }
    .send-btn:disabled { cursor: not-allowed; opacity: 0.5; }

    button:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }

    .note {
      color: var(--soft);
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
    }

    @media (max-width: 600px) {
      header, main, footer { padding-left: 14px; padding-right: 14px; }
      .dateline { display: none; }
      .bubble { max-width: 94%; }
      .welcome h2 { font-size: 1.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>News<span>Lens</span></h1>
        <p>News and media assistant</p>
      </div>
      <div class="header-tools">
        <span class="dateline" id="dateline"></span>
        <button class="clear-btn" id="clearBtn" type="button">New chat</button>
      </div>
    </header>

    <main id="chat">
      <section class="welcome" id="welcome">
        <h2>Read the news with a sharper eye.</h2>
        <p>Ask about journalism, fact-checking, media literacy, news writing, or how the media industry works.</p>
        <div class="suggestions">
          <button type="button">How can I check if a news story is fake?</button>
          <button type="button">Explain the inverted pyramid in news writing</button>
          <button type="button">What is the difference between bias and opinion in media?</button>
          <button type="button">How do I write a press release?</button>
        </div>
      </section>
    </main>

    <footer>
      <div class="composer">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a news or media question"></textarea>
        <button class="send-btn" id="sendBtn" type="button">Send</button>
      </div>
      <p class="note">No live news access. Check several reputable outlets for current events.</p>
    </footer>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const dateline = document.getElementById("dateline");

    let messages = [];
    let isWaiting = false;

    dateline.textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }).format(new Date());

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function formatBlock(block) {
      let html = "";
      let openList = null;

      const closeList = () => {
        if (openList) {
          html += `</${openList}>`;
          openList = null;
        }
      };

      for (const rawLine of block.split("\n")) {
        const line = rawLine.trim();
        const bullet = line.match(/^[-*]\s+(.*)/);
        const numbered = line.match(/^\d+\.\s+(.*)/);
        const heading = line.match(/^#{1,4}\s+(.*)/);

        if (bullet || numbered) {
          const tag = bullet ? "ul" : "ol";
          if (openList !== tag) {
            closeList();
            html += `<${tag}>`;
            openList = tag;
          }
          html += `<li>${formatInline((bullet || numbered)[1])}</li>`;
        } else {
          closeList();
          if (heading) {
            html += `<h4>${formatInline(heading[1])}</h4>`;
          } else if (line) {
            html += `<p>${formatInline(line)}</p>`;
          }
        }
      }

      closeList();
      return html;
    }

    function formatReply(text) {
      const parts = escapeHtml(text).split(/```(?:\w+)?\n?([\s\S]*?)```/g);
      return parts
        .map((part, index) => (index % 2 === 1 ? `<pre><code>${part}</code></pre>` : formatBlock(part)))
        .join("");
    }

    function addMessage(role, content, isError = false) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble" + (isError ? " error" : "");

      if (role === "user") {
        bubble.textContent = content;
      } else {
        bubble.innerHTML = formatReply(content);
      }

      wrapper.appendChild(bubble);
      chat.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function addTypingIndicator() {
      const wrapper = document.createElement("div");
      wrapper.className = "message assistant";
      wrapper.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      chat.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function setWaiting(state) {
      isWaiting = state;
      sendBtn.disabled = state;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight}px`;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || isWaiting) return;

      welcome.style.display = "none";
      addMessage("user", message);
      messages.push({ role: "user", content: message });

      input.value = "";
      resizeInput();
      setWaiting(true);

      const typing = addTypingIndicator();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          messages.pop();
          addMessage("assistant", data.error || "Something went wrong. Please try again.", true);
        } else {
          messages.push({ role: "assistant", content: data.reply });
          addMessage("assistant", data.reply);
        }
      } catch (error) {
        typing.remove();
        messages.pop();
        addMessage("assistant", "Could not reach the server. Check your connection and try again.", true);
      } finally {
        setWaiting(false);
        input.focus();
      }
    }

    function resetChat() {
      messages = [];
      chat.querySelectorAll(".message").forEach((node) => node.remove());
      welcome.style.display = "";
      input.focus();
    }

    sendBtn.addEventListener("click", () => sendMessage(input.value));
    clearBtn.addEventListener("click", resetChat);
    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(input.value);
      }
    });

    document.querySelectorAll(".suggestions button").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.textContent));
    });

    input.focus();
  </script>
</body>
</html>
